name: bleat-live-tests

services:
  audiobookshelf-root:
    image: ghcr.io/advplyr/audiobookshelf:2.36.0@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e
    ports:
      - "${BLEAT_ABS_ROOT_PORT:-13378}:80"
    environment:
      TZ: Australia/Brisbane
    volumes:
      - root-config:/config
      - root-metadata:/metadata
      - ./media:/audiobooks:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/healthcheck"]
      interval: 1s
      timeout: 2s
      retries: 60
    restart: "no"

  audiobookshelf-prefix:
    image: ghcr.io/advplyr/audiobookshelf:2.36.0@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e
    ports:
      - "${BLEAT_ABS_PREFIX_PORT:-13379}:80"
    environment:
      TZ: Australia/Brisbane
      ROUTER_BASE_PATH: /audiobookshelf
    volumes:
      - prefix-config:/config
      - prefix-metadata:/metadata
      - ./media:/audiobooks:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/audiobookshelf/healthcheck"]
      interval: 1s
      timeout: 2s
      retries: 60
    restart: "no"

volumes:
  root-config:
  root-metadata:
  prefix-config:
  prefix-metadata:
