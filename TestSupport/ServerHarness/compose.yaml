name: bleat-live-tests

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "${BLEAT_HTTPS_ROOT_PORT:-13478}:8443"
      - "${BLEAT_HTTPS_PREFIX_PORT:-13479}:8444"
      - "${BLEAT_OIDC_HTTPS_PORT:-13480}:8445"
    environment:
      BLEAT_PREFIX_UPSTREAM: "${BLEAT_PREFIX_UPSTREAM:-audiobookshelf-prefix:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "test", "-f", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 1s
      timeout: 2s
      retries: 60
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command:
      - start-dev
      - --http-port=8080
      - --hostname=https://caddy:8445
      - --hostname-strict=false
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: bleat-keycloak-admin
    volumes:
      - ./keycloak/bleat-realm.json:/opt/keycloak/data/import/bleat-realm.json:ro
    restart: "no"

  audiobookshelf-root:
    image: ghcr.io/advplyr/audiobookshelf:2.36.0@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e
    ports:
      - "${BLEAT_ABS_ROOT_PORT:-13378}:80"
    environment:
      TZ: Australia/Brisbane
      NODE_EXTRA_CA_CERTS: /caddy-data/caddy/pki/authorities/local/root.crt
    volumes:
      - root-config:/config
      - root-metadata:/metadata
      - caddy-data:/caddy-data:ro
      - "${BLEAT_MEDIA_ROOT:-./media}:/audiobooks:${BLEAT_MEDIA_ACCESS_MODE:-ro}"
      - ./media-large:/audiobooks-large:ro
    depends_on:
      caddy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/healthcheck"]
      interval: 1s
      timeout: 2s
      retries: 60
    restart: "no"

  audiobookshelf-prefix:
    image: ghcr.io/advplyr/audiobookshelf:2.36.0@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e
    ports:
      - "${BLEAT_ABS_PREFIX_PORT:-13379}:80"
    environment:
      TZ: Australia/Brisbane
      ROUTER_BASE_PATH: /audiobookshelf
      NODE_EXTRA_CA_CERTS: /caddy-data/caddy/pki/authorities/local/root.crt
    volumes:
      - prefix-config:/config
      - prefix-metadata:/metadata
      - caddy-data:/caddy-data:ro
      - "${BLEAT_MEDIA_ROOT:-./media}:/audiobooks:${BLEAT_MEDIA_ACCESS_MODE:-ro}"
      - ./media-large:/audiobooks-large:ro
    depends_on:
      caddy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/audiobookshelf/healthcheck"]
      interval: 1s
      timeout: 2s
      retries: 60
    restart: "no"

volumes:
  caddy-data:
  caddy-config:
  root-config:
  root-metadata:
  prefix-config:
  prefix-metadata:
