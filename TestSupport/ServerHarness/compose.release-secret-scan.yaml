services:
  caddy:
    ports:
      - "${BLEAT_TELEMETRY_AUTH_HTTPS_PORT}:8446"
      - "${BLEAT_TELEMETRY_OTLP_HTTPS_PORT}:8447"
      - "${BLEAT_SECRET_BROKER_HTTPS_PORT}:8448"
    environment:
      BLEAT_API_TEST_PORT: ${BLEAT_API_TEST_PORT}
      BLEAT_TELEMETRY_COLLECTOR_TEST_PORT: ${BLEAT_TELEMETRY_COLLECTOR_TEST_PORT}
      BLEAT_SECRET_BROKER_TEST_PORT: ${BLEAT_SECRET_BROKER_TEST_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile.release-secret-scan:/etc/caddy/Caddyfile:ro
