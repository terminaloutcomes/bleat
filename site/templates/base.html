<!doctype html>
<html lang="{{ config.default_language }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    <meta name="theme-color" content="#2b025d">
    <title>{% block title %}{{ config.title }} — Native Audiobookshelf listening{% endblock title %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ get_url(path='bleat.svg') }}">
    <link rel="stylesheet" href="{{ get_url(path='styles.css', cachebust=true) }}">
  </head>
  <body class="bg-ink font-sans text-mist antialiased">
    <div class="relative isolate flex min-h-screen flex-col overflow-hidden">
      <div aria-hidden="true" class="absolute inset-x-0 top-0 -z-10 h-[50rem] overflow-hidden bg-plum">
        <div class="absolute -left-40 top-12 size-96 rounded-full bg-lilac/30 blur-3xl"></div>
        <div class="absolute right-0 top-48 size-[28rem] rounded-full bg-violet/60 blur-3xl"></div>
        <div class="absolute inset-x-0 bottom-0 h-56 bg-gradient-to-t from-ink to-transparent"></div>
      </div>

      <header class="mx-auto flex w-full max-w-6xl items-center justify-between px-6 py-6 sm:px-8 lg:px-10">
        {% block header %}
        <a class="inline-flex items-center gap-3 rounded-lg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-lilac" href="{{ get_url(path='@/_index.md') }}" aria-label="Bleat home">
          <img class="size-10 rounded-xl shadow-lg shadow-ink/25" src="{{ get_url(path='bleat.svg') }}" alt="">
          <span class="text-xl font-semibold tracking-tight text-white">Bleat</span>
        </a>
        {% endblock header %}
      </header>

      {% block main %}{% endblock main %}

      <footer class="border-t border-white/10 px-6 py-8 sm:px-8 lg:px-10">
        <div class="mx-auto flex max-w-6xl flex-col gap-4 text-sm text-muted-lilac sm:flex-row sm:items-center sm:justify-between">
          <span>Bleat - <a class="rounded-sm transition hover:text-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-lilac" href="https://terminaloutcomes.com">A Terminal Outcomes project</a></span>
          <nav class="flex flex-wrap gap-x-5 gap-y-3" aria-label="Footer">
            <a class="rounded-sm transition hover:text-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-lilac" href="{{ get_url(path='@/help/_index.md') }}">Help and troubleshooting</a>
            <a class="rounded-sm transition hover:text-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-lilac" href="{{ get_url(path='@/age-suitability.md') }}">Age suitability</a>
            <a class="rounded-sm transition hover:text-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-lilac" href="mailto:bleat@terminaloutcomes.com">Contact</a>
          </nav>
        </div>
      </footer>
    </div>
  </body>
</html>
