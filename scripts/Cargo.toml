[package]
name = "scripts"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
publish = { workspace = true }

[dependencies]
async-compression = { version = "0.4.51", features = ["tokio", "gzip"] }
base64 = "0.23.1"
build-scripts = { version = "0.1.0", path = "../build-scripts" }
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

clap = { version = "4.6.7", features = ["derive", "env"] }
compact_jwt = "0.6.0"
futures-util = "0.3"
libc = "0.2"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
md-5 = "0.11.0"
percent-encoding = "2.3.2"
plist = "1.10.3"
pulldown-cmark = { version = "0.13.5", default-features = false }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "gzip", "json", "query", "rustls", "stream"], default-features = false }
reqwest-middleware = { version = "0.5", features = ["query"] }
reqwest-retry = "0.9"
reqwest-tracing = "0.7"
roxmltree = "0.21.2"
rust_decimal = "1.43.0"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
signal-hook = "0.4.5"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt", "time"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
url = { version = "2.5.8", features = ["serde"] }
zip = "9.1.1"
yaml-rust2 = "0.13.0"

[lib]
name = "scripts"
path = "src/lib.rs"

[dev-dependencies]
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pem", "pkcs8"] }
