title = "Bleat release secret scanning"
minVersion = "v8.30.1"

[extend]
useDefault = true

[[rules]]
id = "private-key-block"
description = "Private PEM or PKCS#8 key material"
regex = '''-----BEGIN (?:EC |RSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'''
keywords = ["PRIVATE KEY"]

[[rules]]
id = "apple-private-key-file"
description = "Apple signing or App Store Connect private key file"
path = '''(?i)(?:^|/)[^/]+\.p8$'''

[[rules]]
id = "pkcs12-or-provisioning-file"
description = "PKCS#12 or Apple provisioning artifact"
path = '''(?i)(?:^|/)[^/]+\.(?:p12|pfx|mobileprovision|provisionprofile)$'''

[[rules]]
id = "telemetry-jwt-signing-key-file"
description = "Telemetry JWT signing-key material"
path = '''(?i)(?:^|/)[^/]*(?:telemetry[-_])?jwt[-_]signing[-_]key[^/]*$'''

[[allowlists]]
description = "The scanner configuration contains detection expressions, not secrets"
paths = ['''(?:^|/)\.gitleaks\.toml$''']
