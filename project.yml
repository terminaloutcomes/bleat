name: Bleat

options:
  bundleIdPrefix: $(BUNDLE_ID_PREFIX)
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

attributes:
  LastUpgradeCheck: "2630"

packages:
  BleatPackage:
    path: .

settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
    BUNDLE_ID_PREFIX: com.terminaloutcomes
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    USE_RECURSIVE_SCRIPT_INPUTS_IN_SCRIPT_PHASES: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  BleatApp:
    type: application
    productName: Bleat
    platform: auto
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Info-macOS.plist
      - path: Bleat.icon
      - path: TestSupport/UIFixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: BleatPackage
        product: BleatCore
      - package: BleatPackage
        product: BleatTranscription
    settings:
      base:
        BUILD_WITHOUT_PAID_DEVELOPER: NO
        BLEAT_APP_ATTEST_MODE: enabled
        BLEAT_CARPLAY_MODE: enabled
        BLEAT_CLOUDKIT_MODE: enabled
        BLEAT_EFFECTIVE_APP_ATTEST_MODE: "$(BLEAT_PAID_DEVELOPER_$(BUILD_WITHOUT_PAID_DEVELOPER)_APP_ATTEST_MODE)"
        BLEAT_EFFECTIVE_CARPLAY_MODE: "$(BLEAT_PAID_DEVELOPER_$(BUILD_WITHOUT_PAID_DEVELOPER)_CARPLAY_MODE)"
        "BLEAT_EFFECTIVE_CARPLAY_MODE[sdk=macosx*]": disabled
        BLEAT_EFFECTIVE_CLOUDKIT_MODE: "$(BLEAT_PAID_DEVELOPER_$(BUILD_WITHOUT_PAID_DEVELOPER)_CLOUDKIT_MODE)"
        BLEAT_PAID_DEVELOPER_NO_APP_ATTEST_MODE: "$(BLEAT_APP_ATTEST_MODE)"
        BLEAT_PAID_DEVELOPER_NO_CARPLAY_MODE: "$(BLEAT_CARPLAY_MODE)"
        BLEAT_PAID_DEVELOPER_NO_CLOUDKIT_MODE: "$(BLEAT_CLOUDKIT_MODE)"
        BLEAT_PAID_DEVELOPER_YES_APP_ATTEST_MODE: disabled
        BLEAT_PAID_DEVELOPER_YES_CARPLAY_MODE: disabled
        BLEAT_PAID_DEVELOPER_YES_CLOUDKIT_MODE: disabled
        BLEAT_CARPLAY_disabled_ENTITLEMENTS: App/Bleat.cloudkit-$(BLEAT_EFFECTIVE_CLOUDKIT_MODE).app-attest-$(BLEAT_EFFECTIVE_APP_ATTEST_MODE).entitlements
        BLEAT_CARPLAY_enabled_ENTITLEMENTS: App/Bleat.cloudkit-$(BLEAT_EFFECTIVE_CLOUDKIT_MODE).app-attest-$(BLEAT_EFFECTIVE_APP_ATTEST_MODE).carplay-enabled.entitlements
        BLEAT_DEVELOPER_NAME: James Hodgkinson
        BLEAT_TELEMETRY_AUTH_BASE_URL: ""
        BLEAT_TELEMETRY_ATTESTER_MODE: app-attest
        BLEAT_TELEMETRY_OTLP_ENDPOINT: ""
        CODE_SIGN_ENTITLEMENTS: "$(BLEAT_CARPLAY_$(BLEAT_EFFECTIVE_CARPLAY_MODE)_ENTITLEMENTS)"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/BleatMac.$(BLEAT_EFFECTIVE_CLOUDKIT_MODE).entitlements
        DEAD_CODE_STRIPPING: YES
        CURRENT_PROJECT_VERSION: "20261014.0835.34"
        MARKETING_VERSION: "2026.10.14"
        ASSETCATALOG_COMPILER_APPICON_NAME: Bleat
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).Bleat"
        PRODUCT_NAME: Bleat
        BLEAT_INFOPLIST_TEMPLATE: App/Info-macOS.plist
        "BLEAT_INFOPLIST_TEMPLATE[sdk=iphoneos*]": App/Info.plist
        "BLEAT_INFOPLIST_TEMPLATE[sdk=iphonesimulator*]": App/Info.plist
        INFOPLIST_FILE: "$(TARGET_TEMP_DIR)/Bleat-Info.plist"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
      configs:
        Debug:
          BLEAT_APP_ATTEST_ENVIRONMENT: development
        Release:
          BLEAT_APP_ATTEST_ENVIRONMENT: production
    preBuildScripts:
      - name: Prepare Build Metadata
        script: |
          set -eu
          cargo build --quiet --locked --manifest-path "${SRCROOT}/Cargo.toml" --target-dir "${TARGET_TEMP_DIR}/RustBuildTools" --package build-scripts --bin validate-release-version --bin validate-paid-developer-build-settings --bin write-build-metadata
          "${TARGET_TEMP_DIR}/RustBuildTools/debug/validate-release-version" --repository-root "${SRCROOT}" --version "${MARKETING_VERSION}" --build "${CURRENT_PROJECT_VERSION}"
          "${TARGET_TEMP_DIR}/RustBuildTools/debug/validate-paid-developer-build-settings"
          "${TARGET_TEMP_DIR}/RustBuildTools/debug/write-build-metadata" --repository-root "${SRCROOT}" --template "${SRCROOT}/${BLEAT_INFOPLIST_TEMPLATE}" --output "${TARGET_TEMP_DIR}/Bleat-Info.plist"
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(SRCROOT)/Cargo.toml"
          - "$(SRCROOT)/Cargo.lock"
          - "$(SRCROOT)/.cargo"
          - "$(SRCROOT)/build-scripts"
          - "$(SRCROOT)/bleat-api"
          - "$(SRCROOT)/scripts"
          - "$(SRCROOT)/project.yml"
          - "$(SRCROOT)/CHANGELOG.md"
          - "$(SRCROOT)/Bleat.xcodeproj/project.pbxproj"
          - "$(SRCROOT)/.git"
          - "$(SRCROOT)/$(BLEAT_INFOPLIST_TEMPLATE)"
        outputFiles:
          - "$(TARGET_TEMP_DIR)/RustBuildTools/debug/validate-release-version"
          - "$(TARGET_TEMP_DIR)/RustBuildTools/debug/validate-paid-developer-build-settings"
          - "$(TARGET_TEMP_DIR)/RustBuildTools/debug/write-build-metadata"
          - "$(TARGET_TEMP_DIR)/Bleat-Info.plist"
        showEnvVars: false

  BleatAppTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: Tests/BleatAppTests
      - path: Tests/BleatTranscriptionTests/AudioChapterSliceExporterTests.swift
    dependencies:
      - target: BleatApp
      - package: BleatPackage
        product: BleatTranscription
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).BleatTests"
        GENERATE_INFOPLIST_FILE: true
        DEAD_CODE_STRIPPING: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bleat.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Bleat"
        BUNDLE_LOADER: "$(TEST_HOST)"

  BleatUITests:
    type: bundle.ui-testing
    platform: iOS
    supportedDestinations:
      - iOS
    sources:
      - path: Tests/BleatUITests
    dependencies:
      - target: BleatApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).BleatUITests"
        GENERATE_INFOPLIST_FILE: true
        DEAD_CODE_STRIPPING: YES
        TEST_TARGET_NAME: BleatApp

schemes:
  Bleat:
    build:
      targets:
        BleatApp: all
        BleatAppTests:
          - test
        BleatUITests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BleatAppTests
        - BleatUITests
    archive:
      config: Release

  BleatMac:
    build:
      targets:
        BleatApp: all
        BleatAppTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BleatAppTests

  BleatPerformance:
    build:
      targets:
        BleatApp: all
        BleatAppTests:
          - test
        BleatUITests:
          - test
    run:
      config: Release
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - BleatAppTests
        - BleatUITests
