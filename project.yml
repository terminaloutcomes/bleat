name: Bleat

options:
  bundleIdPrefix: $(BUNDLE_ID_PREFIX)
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

attributes:
  LastUpgradeCheck: "2630"

packages:
  BleatPackage:
    path: .

settings:
  base:
    BUNDLE_ID_PREFIX: com.yaleman
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  BleatApp:
    type: application
    productName: Bleat
    platform: auto
    supportedDestinations:
      - iOS
      - macCatalyst
    sources:
      - path: App
      - path: Bleat.icon
    dependencies:
      - package: BleatPackage
        product: BleatCore
      - package: BleatPackage
        product: BleatTranscription
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Bleat
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER)"
            CFBundleURLSchemes:
              - bleat
              - com.yaleman.bleat
        BleatBuildDate: Unavailable
        BleatAppAttestMode: "$(BLEAT_EFFECTIVE_APP_ATTEST_MODE)"
        BleatCloudKitMode: "$(BLEAT_EFFECTIVE_CLOUDKIT_MODE)"
        BleatDeveloperName: "$(BLEAT_DEVELOPER_NAME)"
        BleatTelemetryAuthenticationBaseURL: "$(BLEAT_TELEMETRY_AUTH_BASE_URL)"
        BleatTelemetryAttesterMode: "$(BLEAT_TELEMETRY_ATTESTER_MODE)"
        BleatTelemetryOTLPEndpoint: "$(BLEAT_TELEMETRY_OTLP_ENDPOINT)"
        NSLocalNetworkUsageDescription: Bleat connects to your Audiobookshelf server on the local network.
        NSBonjourServices:
          - _audiobookshelf._tcp
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: Bleat CarPlay
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlaySceneDelegate"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        BUILD_WITHOUT_PAID_DEVELOPER: NO
        BLEAT_APP_ATTEST_MODE: enabled
        BLEAT_CLOUDKIT_MODE: enabled
        BLEAT_EFFECTIVE_APP_ATTEST_MODE: "$(BLEAT_PAID_DEVELOPER_$(BUILD_WITHOUT_PAID_DEVELOPER)_APP_ATTEST_MODE)"
        BLEAT_EFFECTIVE_CLOUDKIT_MODE: "$(BLEAT_PAID_DEVELOPER_$(BUILD_WITHOUT_PAID_DEVELOPER)_CLOUDKIT_MODE)"
        BLEAT_PAID_DEVELOPER_NO_APP_ATTEST_MODE: "$(BLEAT_APP_ATTEST_MODE)"
        BLEAT_PAID_DEVELOPER_NO_CLOUDKIT_MODE: "$(BLEAT_CLOUDKIT_MODE)"
        BLEAT_PAID_DEVELOPER_YES_APP_ATTEST_MODE: disabled
        BLEAT_PAID_DEVELOPER_YES_CLOUDKIT_MODE: disabled
        BLEAT_DEVELOPER_NAME: James Hodgkinson
        BLEAT_TELEMETRY_AUTH_BASE_URL: ""
        BLEAT_TELEMETRY_ATTESTER_MODE: app-attest
        BLEAT_TELEMETRY_OTLP_ENDPOINT: ""
        CODE_SIGN_ENTITLEMENTS: App/Bleat.cloudkit-$(BLEAT_EFFECTIVE_CLOUDKIT_MODE).app-attest-$(BLEAT_EFFECTIVE_APP_ATTEST_MODE).entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/BleatMac.$(BLEAT_EFFECTIVE_CLOUDKIT_MODE).entitlements
        CURRENT_PROJECT_VERSION: "1"
        DEAD_CODE_STRIPPING: YES
        MARKETING_VERSION: "0.1.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: Bleat
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).Bleat"
        PRODUCT_NAME: Bleat
        "IPHONEOS_DEPLOYMENT_TARGET[sdk=macosx*]": "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
      configs:
        Debug:
          BLEAT_APP_ATTEST_ENVIRONMENT: development
        Release:
          BLEAT_APP_ATTEST_ENVIRONMENT: production
    preBuildScripts:
      - path: scripts/validate-paid-developer-build-settings.sh
        name: Validate Paid Developer Build Settings
        basedOnDependencyAnalysis: false
        showEnvVars: false
    postBuildScripts:
      - path: scripts/write-build-metadata.sh
        name: Write Build Metadata
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        showEnvVars: false

  BleatAppTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations:
      - iOS
      - macCatalyst
    sources:
      - path: Tests/BleatAppTests
      - path: Tests/BleatTranscriptionTests/AudioChapterSliceExporterTests.swift
    dependencies:
      - target: BleatApp
      - package: BleatPackage
        product: BleatTranscription
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).BleatTests"
        GENERATE_INFOPLIST_FILE: true
        DEAD_CODE_STRIPPING: YES
        "IPHONEOS_DEPLOYMENT_TARGET[sdk=macosx*]": "18.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bleat.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Bleat"
        BUNDLE_LOADER: "$(TEST_HOST)"

  BleatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/BleatUITests
    dependencies:
      - target: BleatApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).BleatUITests"
        GENERATE_INFOPLIST_FILE: true
        DEAD_CODE_STRIPPING: YES
        TEST_TARGET_NAME: BleatApp

schemes:
  Bleat:
    build:
      targets:
        BleatApp: all
        BleatAppTests:
          - test
        BleatUITests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BleatAppTests
        - BleatUITests
    archive:
      config: Release

  BleatMac:
    build:
      targets:
        BleatApp: all
        BleatAppTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BleatAppTests
