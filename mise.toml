[env]
_.file = { path = ".envrc", redact = true }

[tasks.iphone]
description = "Build and launch Bleat on the default iPhone simulator"
run = ["./scripts/launch-iphone.sh"]

[tasks."macos:compile"]
description = "Compile an unsigned Bleat Release app with Mac Catalyst"
run = "./scripts/compile-macos.sh"

[tasks."macos:test"]
run = ["./scripts/test-macos.sh"]
description = "Run app-hosted tests in a development-signed Mac Catalyst app"

[tasks."test:local"]
description = "Run host, Release build, and iOS Simulator tests"
run = ["./scripts/test-core.sh"]

[tasks."test:live"]
description = "Run core tests against disposable Audiobookshelf servers"
run = ["./scripts/test-live.sh"]

[tasks."test:app-live"]
description = "Run live app journeys on a disposable iOS Simulator"
run = ["./scripts/test-app-live.sh"]

[tasks.check]
description = "Run every automated test that does not require a physical device"
run = [
  { task = "test:local" },
  { task = "test:live" },
  { task = "test:app-live" },
]

[tasks.macos]
description = "Build and launch a development-signed Mac Catalyst app"
run = ["./scripts/build-macos.sh"]

[tasks.archive]
description = "Create and validate the Release archive"
run = ["./scripts/archive-beta.sh"]

[tasks."device:status"]
description = "List signing identities and connected Apple devices"
run = [
  "security find-identity -v -p codesigning",
  "xcrun devicectl list devices",
]

[tasks."device:build"]
description = "Build a development-signed Release app for a physical iPhone"
#Until CloudKit is supported on physical devices by getting a "proper" account
env = { BLEAT_CLOUDKIT_MODE = "disabled" }
run = ["./scripts/build-device.sh"]

[tasks."device:install"]
description = "Install the signed Release app on a physical iPhone"
depends = ["device:build"]
run = """
#!/usr/bin/env zsh
set -euo pipefail

: "${BLEAT_DEVICE_ID:?Set BLEAT_DEVICE_ID to the connected iPhone UDID}"

xcrun devicectl device install app \
  --device "${BLEAT_DEVICE_ID}" \
  .build/device-release/Build/Products/Release-iphoneos/Bleat.app
"""

[tasks."device:launch"]
description = "Launch Bleat on a physical iPhone"
depends = ["device:install"]
run = """
#!/usr/bin/env zsh
set -euo pipefail

: "${BLEAT_DEVICE_ID:?Set BLEAT_DEVICE_ID to the connected iPhone UDID}"
readonly bleat_bundle_id="${BLEAT_BUNDLE_ID:?Set BLEAT_BUNDLE_ID to the bundle identifier for the app}"

xcrun devicectl device process launch \
  --device "${BLEAT_DEVICE_ID}" \
  "${bleat_bundle_id}"
"""

[tasks.device]
description = "Build, install, and launch Bleat on a physical iPhone"
depends = ["device:launch"]
