[env]
_.file = { path = ".envrc", redact = true }

[tasks.iphone]
description = "Build and launch Bleat on the default iPhone simulator"
run = [
  """xcodebuild \
  -project Bleat.xcodeproj \
  -scheme Bleat \
  -configuration Debug \
  -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
  -derivedDataPath .build/xcode-derived \
  BLEAT_CLOUDKIT_MODE="${BLEAT_CLOUDKIT_MODE:-enabled}" \
  build""",
  """xcrun simctl install booted \
  .build/xcode-derived/Build/Products/Debug-iphonesimulator/Bleat.app""",
  "xcrun simctl launch --terminate-running-process booted com.yaleman.Bleat",
]

[tasks."macos:compile"]
description = "Compile an unsigned Bleat Release app with Mac Catalyst"
run = """xcodebuild \
  -project Bleat.xcodeproj \
  -scheme Bleat \
  -configuration Release \
  -destination 'generic/platform=macOS,variant=Mac Catalyst' \
  -derivedDataPath .build/xcode-derived \
  CODE_SIGNING_ALLOWED=NO \
  CODE_SIGNING_REQUIRED=NO \
  BLEAT_CLOUDKIT_MODE="${BLEAT_CLOUDKIT_MODE:-enabled}" \
  build"""

[tasks."macos:test"]
description = "Run app-hosted tests in a development-signed Mac Catalyst app"
run = """
#!/usr/bin/env zsh
set -euo pipefail

: "${BLEAT_DEVELOPMENT_TEAM:?Set BLEAT_DEVELOPMENT_TEAM to the Apple team ID}"
readonly bleat_bundle_id="${BLEAT_BUNDLE_ID:-com.yaleman.Bleat}"

xcodebuild \
  -project Bleat.xcodeproj \
  -scheme BleatMac \
  -configuration Debug \
  -destination 'platform=macOS,variant=Mac Catalyst' \
  -derivedDataPath .build/macos-signed \
  -allowProvisioningUpdates \
  DEVELOPMENT_TEAM="${BLEAT_DEVELOPMENT_TEAM}" \
  CODE_SIGN_STYLE=Automatic \
  PRODUCT_BUNDLE_IDENTIFIER="${bleat_bundle_id}" \
  BLEAT_CLOUDKIT_MODE="${BLEAT_CLOUDKIT_MODE:-enabled}" \
  test
"""

[tasks.macos]
description = "Build and launch a development-signed Mac Catalyst app"
run = """
#!/usr/bin/env zsh
set -euo pipefail

: "${BLEAT_DEVELOPMENT_TEAM:?Set BLEAT_DEVELOPMENT_TEAM to the Apple team ID}"
readonly bleat_bundle_id="${BLEAT_BUNDLE_ID:-com.yaleman.Bleat}"
readonly bleat_app=".build/macos-signed/Build/Products/Release-maccatalyst/Bleat.app"
readonly entitlements_file="$(mktemp "${TMPDIR:-/tmp}/bleat-entitlements.XXXXXX")"
readonly codesign_output="$(mktemp "${TMPDIR:-/tmp}/bleat-codesign.XXXXXX")"
trap 'rm -f "${entitlements_file}" "${codesign_output}"' EXIT

xcodebuild \
  -project Bleat.xcodeproj \
  -scheme BleatMac \
  -configuration Release \
  -destination 'platform=macOS,variant=Mac Catalyst' \
  -derivedDataPath .build/macos-signed \
  -allowProvisioningUpdates \
  DEVELOPMENT_TEAM="${BLEAT_DEVELOPMENT_TEAM}" \
  CODE_SIGN_STYLE=Automatic \
  PRODUCT_BUNDLE_IDENTIFIER="${bleat_bundle_id}" \
  BLEAT_CLOUDKIT_MODE="${BLEAT_CLOUDKIT_MODE:-enabled}" \
  build

codesign --verify --deep --strict "${bleat_app}"
codesign -d --entitlements :- "${bleat_app}" \
  >"${entitlements_file}" 2>"${codesign_output}"
plutil -extract keychain-access-groups.0 raw \
  "${entitlements_file}" >/dev/null
codesign -dvv "${bleat_app}" 2>&1 \
  | grep -Eq '^TeamIdentifier=[A-Z0-9]+$'
open "${bleat_app}"
"""

[tasks.archive]
description = "Create and validate the Release archive"
run = "./scripts/archive-beta.sh"

[tasks."device:status"]
description = "List signing identities and connected Apple devices"
run = [
  "security find-identity -v -p codesigning",
  "xcrun devicectl list devices",
]

[tasks."device:build"]
description = "Build a development-signed Release app for a physical iPhone"
env = { BLEAT_CLOUDKIT_MODE = "disabled" } #Until CloudKit is supported on physical devices by getting a "proper" account
run = """
#!/usr/bin/env zsh
set -euo pipefail

: "${BLEAT_DEVELOPMENT_TEAM:?Set BLEAT_DEVELOPMENT_TEAM to the Apple team ID}"
: "${BLEAT_DEVICE_ID:?Set BLEAT_DEVICE_ID to the connected iPhone UDID}"
readonly bleat_bundle_id="${BLEAT_BUNDLE_ID:-com.yaleman.Bleat}"

xcodebuild \
  -project Bleat.xcodeproj \
  -scheme Bleat \
  -configuration Release \
  -destination "platform=iOS,id=${BLEAT_DEVICE_ID}" \
  -derivedDataPath .build/device-release \
  -allowProvisioningUpdates \
  -allowProvisioningDeviceRegistration \
  DEVELOPMENT_TEAM="${BLEAT_DEVELOPMENT_TEAM}" \
  CODE_SIGN_STYLE=Automatic \
  PRODUCT_BUNDLE_IDENTIFIER="${bleat_bundle_id}" \
  BLEAT_CLOUDKIT_MODE="${BLEAT_CLOUDKIT_MODE:-enabled}" \
  build
"""

[tasks."device:install"]
description = "Install the signed Release app on a physical iPhone"
run = """
#!/usr/bin/env zsh
set -euo pipefail

: "${BLEAT_DEVICE_ID:?Set BLEAT_DEVICE_ID to the connected iPhone UDID}"

xcrun devicectl device install app \
  --device "${BLEAT_DEVICE_ID}" \
  .build/device-release/Build/Products/Release-iphoneos/Bleat.app
"""

[tasks."device:launch"]
description = "Launch Bleat on a physical iPhone"
run = """
#!/usr/bin/env zsh
set -euo pipefail

: "${BLEAT_DEVICE_ID:?Set BLEAT_DEVICE_ID to the connected iPhone UDID}"
readonly bleat_bundle_id="${BLEAT_BUNDLE_ID:-com.yaleman.Bleat}"

xcrun devicectl device process launch \
  --device "${BLEAT_DEVICE_ID}" \
  "${bleat_bundle_id}"
"""

[tasks.device]
description = "Build, install, and launch Bleat on a physical iPhone"
run = [
  "mise run device:build",
  "mise run device:install",
  "mise run device:launch",
]
