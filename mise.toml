[env]
_.file = { path = ".envrc", redact = true }

[tools]
gitleaks = "8.30.1"
git-lfs = "latest"
node = "24"
pnpm = "11.17.0"
rust = "1.97.0"
zola = "0.22.1"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-tarpaulin" = "0.32.8"

[tasks."api:fmt"]
description = "Fix bleat-api Rust formatting"
dir = "./bleat-api"
run = "cargo fmt --all"

[tasks."api:check"]
description = "cargo-check bleat-api"
dir = "./bleat-api"
depends = ["api:fmt"]
run = "cargo check --all-targets --all-features"

[tasks."api:clippy"]
description = "Lint bleat-api"
dir = "./bleat-api"
depends = ["api:fmt"]
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks."api:test"]
description = "Test bleat-api against disposable PostgreSQL"
depends = ["api:fmt"]
run = """cargo test \
  --quiet \
  --locked \
  --manifest-path bleat-api/Cargo.toml \
  --all-features \
  -- \
  --nocapture \
  --test-threads=4"""

[tasks."api:build"]
description = "Build the bleat-api release binary"
depends = ["api:fmt"]
dir = "./bleat-api"
run = "cargo build --release --quiet"

[tasks."api:coverage"]
description = "Measure self-contained bleat-api Rust test coverage"
run = "./scripts/coverage-bleat-api.sh"

[tasks."api:validate"]
description = "Run every bleat-api validation gate"
depends = ["api:check", "api:clippy", "api:test"]
run = ["cargo build --manifest-path bleat-api/Cargo.toml --release"]

[tasks."api:run"]
description = "Run bleat-api and PostgreSQL locally"
run = "docker compose --file bleat-api/compose.yml up --build api"

[tasks."api:down"]
description = "Stop the local bleat-api and PostgreSQL"
run = "docker compose --file bleat-api/compose.yml down --volumes --remove-orphans"

[tasks."bleat-logs"]
description = "Check the ClickStack bleat logs API"
run = "./scripts/bleat-logs.py health"


[tasks."api:container:build-local"]
description = "Build and push a local Docker image for bleat-api"
run = """
bleat_api_image_ref=${BLEAT_API_LOCAL_TAG:?Set BLEAT_API_LOCAL_TAG}
bleat_api_image_name=${bleat_api_image_ref%:*}
bleat_api_image_tag=${bleat_api_image_ref##*:}
case ${bleat_api_image_tag} in
  */*)
    echo "BLEAT_API_LOCAL_TAG must include an explicit tag" >&2
    exit 64
    ;;
esac
bleat_api_image_version=$(git rev-parse --verify HEAD)

docker buildx build \
  --platform linux/arm64,linux/amd64 \
  --build-arg BLEAT_API_IMAGE_NAME=${bleat_api_image_name} \
  --build-arg BLEAT_API_IMAGE_VERSION=${bleat_api_image_version} \
  --tag ${bleat_api_image_ref} \
  --tag ${bleat_api_image_name}:${bleat_api_image_version} \
  --file bleat-api/Dockerfile \
  --push \
  .
"""

[tasks."site-css"]
description = "Install website dependencies and generate the Tailwind stylesheet"
run = [
  "pnpm --dir site install --frozen-lockfile",
  "pnpm --dir site run build:css",
]

[tasks."site-check"]
description = "Validate the Zola website"
depends = ["site-css"]
run = "zola --root site check"

[tasks."site-build"]
description = "Build the production website"
depends = ["site-css"]
run = [
  "cp LICENSE.md site/content/license.txt",
  "zola --root site build --output-dir site/public --force",
]

[tasks."site-serve"]
description = "Serve the website locally"
depends = ["site-css", "site-build"]
dir = "./site"
run = "zola serve"

[tasks.simulator]
description = "Build and launch Bleat on the default iPhone simulator"
run = ["./scripts/launch-iphone.sh"]

[tasks."macos:compile"]
description = "Compile an unsigned Bleat Release app for macOS"
run = "./scripts/compile-macos.sh"

[tasks."macos:test"]
run = ["./scripts/test-macos.sh"]
description = "Run app-hosted tests in a development-signed macOS app"

[tasks."test:local"]
description = "Run host, Release build, and iOS Simulator tests"
run = ["./scripts/test-core.sh"]

[tasks."test:live"]
description = "Run core tests against disposable Audiobookshelf servers"
run = ["./scripts/test-live.sh"]

[tasks."test:app-live"]
description = "Run live app journeys on a disposable iOS Simulator"
run = ["./scripts/test-app-live.sh"]

[tasks."test:telemetry"]
description = "Run the disposable authenticated telemetry end-to-end gate"
run = ["./scripts/test-telemetry.sh"]

[tasks."security:secrets"]
description = "Validate secret-scanning rules and scan the current source tree"
run = ["./scripts/test-secret-scanning.sh"]

[tasks."security:dependencies"]
description = "Audit the locked Rust dependencies for advisories and yanked crates"
run = ["./scripts/audit-rust-dependencies.sh"]

[tasks."security:validate"]
description = "Run the repository-supported release security gate"
depends = ["security:secrets", "security:dependencies"]

[tasks.clean]
description = "Remove repository build artifacts"
run = ["./scripts/clean-build-artifacts.sh"]

[tasks.screenshots]
description = "Capture Release screenshots from the live Barnyard fixture"
run = ["./scripts/capture-release-screenshots.sh"]

[tasks."screenshots:check"]
description = "Validate the release screenshot fixture and harness contracts"
run = ["./scripts/test-release-screenshot-harness.sh"]

[tasks."test:landscape"]
description = "Run the focused landscape UI audit on iPhone and iPad simulators"
run = ["./scripts/test-landscape-ui.sh"]

[tasks."test:deep-links"]
description = "Validate cold and warm bleat URL routing on a disposable iOS Simulator"
run = ["./scripts/test-deep-links.sh"]

[tasks.check]
description = "Run every automated test that does not require a physical device"
depends = ["site-check"]
run = [
  { task = "security:validate" },
  { task = "api:validate" },
  { task = "test:telemetry" },
  { task = "site-check" },
  { task = "test:local" },
  { task = "test:live" },
  { task = "test:app-live" },
]

[tasks.macos]
description = "Build and launch a development-signed macOS app"
run = ["./scripts/build-macos.sh"]

[tasks.archive]
description = "Create and validate the Release archive"
run = [{ task = "security:validate" }, "./scripts/archive-beta.sh"]

[tasks."devices:status"]
description = "List signing identities and connected Apple devices"
run = [
  "security find-identity -v -p codesigning",
  "xcrun devicectl list devices",
]

[tasks."iphone:build"]
description = "Build a development-signed Release app for a physical iPhone"
env = { BUILD_WITHOUT_PAID_DEVELOPER = "NO" }
run = """
BLEAT_DEVICE_ID="${BLEAT_IPHONE_ID:?Set BLEAT_IPHONE_ID to the connected iPhone UDID}"
BLEAT_DEVICE_BUILD_DIRECTORY=".build/iphone-release"
export BLEAT_DEVICE_ID BLEAT_DEVICE_BUILD_DIRECTORY
exec ./scripts/build-device.sh
"""

[tasks."iphone:install"]
description = "Install the signed Release app on a physical iPhone"
depends = ["iphone:build"]
run = """
#!/usr/bin/env zsh
set -euo pipefail

BLEAT_DEVICE_ID="${BLEAT_IPHONE_ID:?Set BLEAT_IPHONE_ID to the connected iPhone UDID}"

xcrun devicectl device install app \
  --device "${BLEAT_DEVICE_ID}" \
  .build/iphone-release/Build/Products/Release-iphoneos/Bleat.app
"""

[tasks."iphone:launch"]
description = "Launch Bleat on a physical iPhone"
depends = ["iphone:install"]
run = """
#!/usr/bin/env zsh
set -euo pipefail

BLEAT_DEVICE_ID="${BLEAT_IPHONE_ID:?Set BLEAT_IPHONE_ID to the connected iPhone UDID}"
readonly bleat_bundle_id="${BLEAT_BUNDLE_ID:?Set BLEAT_BUNDLE_ID to the bundle identifier for the app}"

xcrun devicectl device process launch \
  --device "${BLEAT_DEVICE_ID}" \
  --terminate-existing \
  "${bleat_bundle_id}"
"""

[tasks.iphone]
description = "Build, install, and launch Bleat on a physical iPhone"
env = { BUILD_WITHOUT_PAID_DEVELOPER = "NO" }
run = """
export BLEAT_DEVICE_ID="${BLEAT_IPHONE_ID:?Set BLEAT_IPHONE_ID to the connected iPhone UDID}"
BLEAT_DEVICE_BUILD_DIRECTORY=".build/iphone-release"
export BLEAT_DEVICE_BUILD_DIRECTORY
exec ./scripts/deploy-device.sh
"""

[tasks."ipad:build"]
description = "Build a development-signed Release app for a physical iPad"
env = { BUILD_WITHOUT_PAID_DEVELOPER = "NO" }
run = """
BLEAT_DEVICE_ID="${BLEAT_IPAD_ID:?Set BLEAT_IPAD_ID to the connected iPad UDID}"
BLEAT_DEVICE_BUILD_DIRECTORY=".build/ipad-release"
export BLEAT_DEVICE_ID BLEAT_DEVICE_BUILD_DIRECTORY
exec ./scripts/build-device.sh
"""

[tasks."ipad:install"]
description = "Install the signed Release app on a physical iPad"
depends = ["ipad:build"]
run = """
#!/usr/bin/env zsh
set -euo pipefail

: "${BLEAT_IPAD_ID:?Set BLEAT_IPAD_ID to the connected iPad UDID}"

xcrun devicectl device install app \
  --device "${BLEAT_IPAD_ID}" \
  .build/ipad-release/Build/Products/Release-iphoneos/Bleat.app
"""

[tasks."ipad:launch"]
description = "Launch Bleat on a physical iPad"
depends = ["ipad:install"]
run = "./scripts/launch-ipad.sh"

[tasks.ipad]
description = "Build, install, and launch Bleat on a physical iPad"
env = { BUILD_WITHOUT_PAID_DEVELOPER = "NO" }
run = """
BLEAT_DEVICE_ID="${BLEAT_IPAD_ID:?Set BLEAT_IPAD_ID to the connected iPad UDID}"
BLEAT_DEVICE_BUILD_DIRECTORY=".build/ipad-release"
export BLEAT_DEVICE_ID BLEAT_DEVICE_BUILD_DIRECTORY
exec ./scripts/deploy-device.sh
"""

[tasks.clippy]
run = { task = "api:clippy" }
