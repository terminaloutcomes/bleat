[env]
_.file = { path = ".envrc", redact = true }

[tools]
node = "24"
pnpm = "11.17.0"
rust = "1.97.0"
zola = "0.22.1"

[tasks."api:fmt"]
description = "Check bleat-api Rust formatting"
run = "cargo fmt --manifest-path bleat-api/Cargo.toml --all -- --check"

[tasks."api:check"]
description = "Type-check bleat-api"
run = "cargo check --manifest-path bleat-api/Cargo.toml --all-targets --all-features"

[tasks."api:clippy"]
description = "Lint bleat-api"
run = "cargo clippy --manifest-path bleat-api/Cargo.toml --all-targets --all-features -- -D warnings"

[tasks."api:test"]
description = "Test bleat-api"
run = "cargo test --manifest-path bleat-api/Cargo.toml --all-features"

[tasks."api:build"]
description = "Build the bleat-api release binary"
run = "cargo build --manifest-path bleat-api/Cargo.toml --release"

[tasks."api:run"]
description = "Run bleat-api with local development defaults"
run = "cargo run --manifest-path bleat-api/Cargo.toml"

[tasks."api:validate"]
description = "Run every bleat-api validation gate"
run = [
  "cargo fmt --manifest-path bleat-api/Cargo.toml --all -- --check",
  "cargo check --manifest-path bleat-api/Cargo.toml --all-targets --all-features",
  "cargo clippy --manifest-path bleat-api/Cargo.toml --all-targets --all-features -- -D warnings",
  "cargo test --manifest-path bleat-api/Cargo.toml --all-features",
  "cargo build --manifest-path bleat-api/Cargo.toml --release",
]

[tasks."site-css"]
description = "Install website dependencies and generate the Tailwind stylesheet"
run = [
  "pnpm --dir site install --frozen-lockfile",
  "pnpm --dir site run build:css",
]

[tasks."site-check"]
description = "Validate the Zola website"
depends = ["site-css"]
run = "zola --root site check"

[tasks."site-build"]
description = "Build the production website"
depends = ["site-css"]
run = "zola --root site build --output-dir site/public --force"

[tasks."site-serve"]
description = "Serve the website locally"
depends = ["site-css"]
run = "zola --root site serve"

[tasks.simulator]
description = "Build and launch Bleat on the default iPhone simulator"
run = ["./scripts/launch-iphone.sh"]

[tasks."macos:compile"]
description = "Compile an unsigned Bleat Release app with Mac Catalyst"
run = "./scripts/compile-macos.sh"

[tasks."macos:test"]
run = ["./scripts/test-macos.sh"]
description = "Run app-hosted tests in a development-signed Mac Catalyst app"

[tasks."test:local"]
description = "Run host, Release build, and iOS Simulator tests"
run = ["./scripts/test-core.sh"]

[tasks."test:live"]
description = "Run core tests against disposable Audiobookshelf servers"
run = ["./scripts/test-live.sh"]

[tasks."test:app-live"]
description = "Run live app journeys on a disposable iOS Simulator"
run = ["./scripts/test-app-live.sh"]

[tasks.screenshots]
description = "Capture Release screenshots from the live Barnyard fixture"
run = ["./scripts/capture-release-screenshots.sh"]

[tasks."screenshots:check"]
description = "Validate the release screenshot fixture and harness contracts"
run = ["./scripts/test-release-screenshot-harness.sh"]

[tasks."test:deep-links"]
description = "Validate cold and warm bleat URL routing on a disposable iOS Simulator"
run = ["./scripts/test-deep-links.sh"]

[tasks.check]
description = "Run every automated test that does not require a physical device"
run = [
  { task = "api:validate" },
  { task = "site-check" },
  { task = "test:local" },
  { task = "test:live" },
  { task = "test:app-live" },
]

[tasks.macos]
description = "Build and launch a development-signed Mac Catalyst app"
run = ["./scripts/build-macos.sh"]

[tasks.archive]
description = "Create and validate the Release archive"
run = ["./scripts/archive-beta.sh"]

[tasks."devices:status"]
description = "List signing identities and connected Apple devices"
run = [
  "security find-identity -v -p codesigning",
  "xcrun devicectl list devices",
]

[tasks."iphone:build"]
description = "Build a development-signed Release app for a physical iPhone"
#Until CloudKit is supported on physical devices by getting a "proper" account
env = { BLEAT_CLOUDKIT_MODE = "disabled" }
run = """
BLEAT_DEVICE_ID="${BLEAT_IPHONE_ID:?Set BLEAT_IPHONE_ID to the connected iPhone UDID}"
BLEAT_DEVICE_BUILD_DIRECTORY=".build/iphone-release"
export BLEAT_DEVICE_BUILD_DIRECTORY
exec ./scripts/build-device.sh
"""

[tasks."iphone:install"]
description = "Install the signed Release app on a physical iPhone"
depends = ["iphone:build"]
run = """
#!/usr/bin/env zsh
set -euo pipefail

BLEAT_DEVICE_ID="${BLEAT_IPHONE_ID:?Set BLEAT_IPHONE_ID to the connected iPhone UDID}"

xcrun devicectl device install app \
  --device "${BLEAT_DEVICE_ID}" \
  .build/iphone-release/Build/Products/Release-iphoneos/Bleat.app
"""

[tasks."iphone:launch"]
description = "Launch Bleat on a physical iPhone"
depends = ["iphone:install"]
run = """
#!/usr/bin/env zsh
set -euo pipefail

BLEAT_DEVICE_ID="${BLEAT_IPHONE_ID:?Set BLEAT_IPHONE_ID to the connected iPhone UDID}"
readonly bleat_bundle_id="${BLEAT_BUNDLE_ID:?Set BLEAT_BUNDLE_ID to the bundle identifier for the app}"

xcrun devicectl device process launch \
  --device "${BLEAT_DEVICE_ID}" \
  --terminate-existing \
  "${bleat_bundle_id}"
"""

[tasks.iphone]
description = "Build, install, and launch Bleat on a physical iPhone"
env = { BLEAT_CLOUDKIT_MODE = "disabled" }
run = """
export BLEAT_DEVICE_ID="${BLEAT_IPHONE_ID:?Set BLEAT_IPHONE_ID to the connected iPhone UDID}"
BLEAT_DEVICE_BUILD_DIRECTORY=".build/iphone-release"
export BLEAT_DEVICE_BUILD_DIRECTORY
exec ./scripts/deploy-device.sh
"""

[tasks."ipad:build"]
description = "Build a development-signed Release app for a physical iPad"
env = { BLEAT_CLOUDKIT_MODE = "disabled" }
run = """
BLEAT_DEVICE_ID="${BLEAT_IPAD_ID:?Set BLEAT_IPAD_ID to the connected iPad UDID}"
BLEAT_DEVICE_BUILD_DIRECTORY=".build/ipad-release"
export BLEAT_DEVICE_ID BLEAT_DEVICE_BUILD_DIRECTORY
exec ./scripts/build-device.sh
"""

[tasks."ipad:install"]
description = "Install the signed Release app on a physical iPad"
depends = ["ipad:build"]
run = """
#!/usr/bin/env zsh
set -euo pipefail

: "${BLEAT_IPAD_ID:?Set BLEAT_IPAD_ID to the connected iPad UDID}"

xcrun devicectl device install app \
  --device "${BLEAT_IPAD_ID}" \
  .build/ipad-release/Build/Products/Release-iphoneos/Bleat.app
"""

[tasks."ipad:launch"]
description = "Launch Bleat on a physical iPad"
depends = ["ipad:install"]
run = """
#!/usr/bin/env zsh
set -euo pipefail

: "${BLEAT_IPAD_ID:?Set BLEAT_IPAD_ID to the connected iPad UDID}"
readonly bleat_bundle_id="${BLEAT_BUNDLE_ID:?Set BLEAT_BUNDLE_ID to the bundle identifier for the app}"

xcrun devicectl device process launch \
  --device "${BLEAT_IPAD_ID}" \
  --terminate-existing \
  "${bleat_bundle_id}"
"""

[tasks.ipad]
description = "Build, install, and launch Bleat on a physical iPad"
env = { BLEAT_CLOUDKIT_MODE = "disabled" }
run = """
BLEAT_DEVICE_ID="${BLEAT_IPAD_ID:?Set BLEAT_IPAD_ID to the connected iPad UDID}"
BLEAT_DEVICE_BUILD_DIRECTORY=".build/ipad-release"
export BLEAT_DEVICE_ID BLEAT_DEVICE_BUILD_DIRECTORY
exec ./scripts/deploy-device.sh
"""

[tasks.trufflehog]
run = """docker run --platform linux/arm64 --rm -i -v "$PWD:/pwd" trufflesecurity/trufflehog:latest filesystem /pwd --exclude-paths='/pwd/.trufflehog-ignore' --exclude-detectors=ProtocolsIO,URI,CloudflareApiToken --no-verification"""
