extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  oidc/bleat:
    issuer_url: ${env:BLEAT_TELEMETRY_ISSUER}
    audience: bleat-telemetry

receivers:
  otlp/bleat:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 1
        auth:
          authenticator: oidc/bleat

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
    spike_limit_mib: 16
  batch:
    timeout: 1s
    send_batch_size: 64
    send_batch_max_size: 128

exporters:
  otlp/private:
    endpoint: ${env:BLEAT_TELEMETRY_PRIVATE_OTLP_ENDPOINT}
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 8
      num_consumers: 1
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 2s
      max_elapsed_time: 10s

service:
  extensions: [health_check, oidc/bleat]
  pipelines:
    traces:
      receivers: [otlp/bleat]
      processors: [memory_limiter, batch]
      exporters: [otlp/private]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
