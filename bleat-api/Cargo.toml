[package]
name = "bleat-api"
version = "0.1.2"
edition = "2024"
publish = false


[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
compact_jwt = { version = "0.6.0", default-features = false }
getrandom = "0.4.3"
governor = { version = "0.10.4", default-features = false, features = ["std"] }
ipnet = "2.12.2"
opentelemetry = { version = "0.32.0", default-features = false, features = [
    "trace",
    "logs",
    "internal-logs",
] }
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-http = { version = "0.32.0", default-features = false }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
    "trace",
    "logs",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls",
    "internal-logs",
] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = [
    "trace",
    "logs",
    "internal-logs",
] }
p256 = { version = "0.14.0", default-features = false, features = [
    "ecdsa",
    "pkcs8",
] }
rustls-pki-types = "1.15.1"
rustls-webpki = { version = "0.103.16", features = ["aws-lc-rs"] }
sea-orm = { version = "2.0.4", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "macros",
    "with-uuid",
    "with-chrono",
] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "time",
    "sync",
] }
tower = { version = "0.5.3", features = ["limit", "load-shed"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
x509-parser = "0.18.1"
zeroize = "1.9.1"

[dev-dependencies]
http-body-util = "0.1.5"
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = [
    "testing",
    "trace",
    "logs",
] }
proptest = "1.12.0"
rcgen = "0.14.10"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tower = { version = "0.5.3", features = ["util"] }


# [profile.release]
# lto = true          # default is false, we want it to try harder
# codegen-units = 4
# panic = "unwind"    # default
# incremental = false # default
