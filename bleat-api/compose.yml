services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: bleat
      POSTGRES_PASSWORD: development-only
      POSTGRES_USER: bleat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bleat -d bleat"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: bleat-api/Dockerfile
      target: runtime
    environment:
      BLEAT_API_BIND_ADDRESS: 0.0.0.0:8080
      BLEAT_API_DATABASE_URL: postgres://bleat:development-only@postgres:5432/bleat
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BLEAT_API_TEST_PORT:-18080}:8080"
  tests:
    build:
      context: ..
      dockerfile: bleat-api/Dockerfile
      target: build
    command:
      - cargo
      - test
      - --locked
      - --manifest-path
      - bleat-api/Cargo.toml
      - --all-features
      - --
      - --nocapture
    environment:
      BLEAT_API_TEST_DATABASE_URL: postgres://bleat:development-only@postgres:5432/bleat
    depends_on:
      postgres:
        condition: service_healthy
