extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 1
      http:
        endpoint: 0.0.0.0:4318

exporters:
  file/traces:
    path: /output/traces.json
    format: json
    flush_interval: 100ms
  file/logs:
    path: /output/logs.json
    format: json
    flush_interval: 100ms

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/traces]
    logs:
      receivers: [otlp]
      exporters: [file/logs]
  telemetry:
    logs:
      level: warn
