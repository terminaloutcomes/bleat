name: Release changed app version

on:
  push:
    branches:
      - main
    paths:
      - project.yml
      - CHANGELOG.md
      - scripts/archive-beta.sh
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect marketing version change
        id: version
        shell: zsh {0}
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          read_project_version() {
            awk '$1 == "MARKETING_VERSION:" {
              gsub(/"/, "", $2)
              print $2
              exit
            }' "$@"
          }

          current_version="$(read_project_version project.yml)"
          if [[ ! "${current_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            print -u2 "Invalid MARKETING_VERSION: ${current_version}"
            exit 1
          fi

          previous_version=""
          if [[ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${BEFORE_SHA}:project.yml" 2>/dev/null
          then
            previous_version="$(
              git show "${BEFORE_SHA}:project.yml" | read_project_version
            )"
          fi

          print "version=${current_version}" >> "${GITHUB_OUTPUT}"
          if [[ "${current_version}" == "${previous_version}" ]]; then
            print "changed=false" >> "${GITHUB_OUTPUT}"
            print "MARKETING_VERSION remains ${current_version}; no release required."
          else
            print "changed=true" >> "${GITHUB_OUTPUT}"
            print "MARKETING_VERSION changed from ${previous_version:-unavailable} to ${current_version}."
          fi

      - name: Prepare changelog release notes
        if: steps.version.outputs.changed == 'true'
        shell: zsh {0}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          escaped_version="${VERSION//./\\.}"
          heading_count="$(
            grep -Ec "^## ${escaped_version} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
              || true
          )"
          if [[ "${heading_count}" != "1" ]]; then
            print -u2 "CHANGELOG.md must contain exactly one dated section for ${VERSION}"
            exit 1
          fi

          mkdir -p .build
          awk -v heading="## ${VERSION} - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > .build/release-notes.md

          if [[ ! -s .build/release-notes.md ]]; then
            print -u2 "The ${VERSION} changelog section has no release notes"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            print -u2 "Tag v${VERSION} already exists; release versions cannot be reused"
            exit 1
          fi

      - name: Set up release security toolchain
        if: steps.version.outputs.changed == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Validate release security
        if: steps.version.outputs.changed == 'true'
        run: mise run security:validate

      - name: Validate Release archive
        if: steps.version.outputs.changed == 'true'
        env:
          BLEAT_CARPLAY_MODE: disabled
          BLEAT_TELEMETRY_AUTH_BASE_URL: ${{ vars.BLEAT_TELEMETRY_AUTH_BASE_URL }}
          BLEAT_TELEMETRY_OTLP_ENDPOINT: ${{ vars.BLEAT_TELEMETRY_OTLP_ENDPOINT }}
        run: ./scripts/archive-beta.sh

      - name: Publish GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Bleat ${VERSION}" \
            --notes-file .build/release-notes.md \
            --fail-on-no-commits
