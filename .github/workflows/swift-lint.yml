name: Lint Swift code

on:
  push:
    branches:
      - main
    paths:
      - App/**/*.swift
      - Sources/**/*.swift
      - Tests/**/*.swift
      - Package.swift
      - mise.toml
      - .swift-format
      - .github/workflows/swift-lint.yml
  pull_request:
    paths:
      - App/**/*.swift
      - Sources/**/*.swift
      - Tests/**/*.swift
      - Package.swift
      - mise.toml
      - .swift-format
      - .github/workflows/swift-lint.yml

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up mise toolchain
        uses: jdx/mise-action@v3

      - name: Lint Swift code
        run: mise run swift-fmt
