name: Validate Bleat

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS lint and smoke
    runs-on: macos-26
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      BLEAT_TELEMETRY_AUTH_BASE_URL: https://telemetry-auth.invalid
      BLEAT_TELEMETRY_OTLP_ENDPOINT: https://telemetry-otlp.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare CI environment file
        run: touch .envrc
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: false
      - name: Install zsh
        run: |
          brew install zsh
      - run: mise run swift-lint
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: false
      - name: Identify compatible Swift caches
        id: cache-keys
        run: |
          rustc --edition=2024 scripts/src/bin/ci-cache-keys.rs -o "$RUNNER_TEMP/bleat-ci-cache-keys"
          "$RUNNER_TEMP/bleat-ci-cache-keys" ios
      - name: Restore iOS Swift packages
        id: swift-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ci-smoke/derived/SourcePackages
          key: ${{ steps.cache-keys.outputs.dependencies }}
      - name: Restore iOS build outputs from main
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/ci-smoke/derived/Build
            .build/ci-smoke/derived/ModuleCache.noindex
          key: ${{ steps.cache-keys.outputs.build }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.build }}-
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # 14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build and run iOS tests
        run: |
          rustc --edition=2024 scripts/src/bin/ci-smoke.rs -o "$RUNNER_TEMP/bleat-ci-smoke"
          "$RUNNER_TEMP/bleat-ci-smoke"
      - name: Generate Swift smoke coverage
        run: |
          bundle exec slather coverage
          bundle exec ruby -r nokogiri -e '
            path = ".build/coverage/swift/cobertura.xml"
            report = Nokogiri::XML(File.read(path))
            abort "Swift coverage contains no executable lines" if report.xpath("//class/lines/line").empty?
            report.xpath("//source").each { |source| source.content = "." }
            File.write(path, report.to_xml)
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: swift-coverage
          path: .build/coverage/swift/cobertura.xml
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ios-smoke-results
          path: .build/ci-smoke/results.xcresult
          retention-days: 7
          if-no-files-found: warn
      - name: Seed iOS Swift packages from successful main validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swift-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ci-smoke/derived/SourcePackages
          key: ${{ steps.cache-keys.outputs.dependencies }}
      - name: Refresh iOS build outputs from successful main validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/ci-smoke/derived/Build
            .build/ci-smoke/derived/ModuleCache.noindex
          key: ${{ steps.cache-keys.outputs.build }}-${{ github.sha }}

  host:
    name: Unsigned Swift host tests and coverage
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Report Apple toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Prepare CI environment file
        run: touch .envrc
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: false
      - name: Identify compatible host Swift packages
        id: cache-keys
        run: |
          rustc --edition=2024 scripts/src/bin/ci-cache-keys.rs -o "$RUNNER_TEMP/bleat-ci-cache-keys"
          "$RUNNER_TEMP/bleat-ci-cache-keys" host
      - name: Restore host Swift packages
        id: swift-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: ${{ steps.cache-keys.outputs.dependencies }}
      - name: Verify host report tooling
        run: python3 -m unittest discover -s TestSupport/HostTests
      - name: Run unsigned host coverage (signed Keychain test excluded)
        env:
          BLEAT_HOST_SIGNING: unsigned
        run: zsh scripts/test-host.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: swift-host-coverage
          path: .build/coverage/swift-host/lcov.info
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: swift-host-results
          path: .build/host-results/*.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Seed host Swift packages from successful main validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swift-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: ${{ steps.cache-keys.outputs.dependencies }}

  rust:
    name: Rust lint, tests and coverage
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Prepare CI environment file
        run: touch .envrc
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt,clippy
          rust-src-dir: bleat-api/
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # c2a87611a18de5b3828c5652fe268e992400cb5c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # 6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install zsh for coverage scripts
        run: sudo apt-get install -y zsh
      - name: Rust validation and checking
        run: mise run 'rust:check'
      - name: Full Rust coverage including container integration tests
        run: |
          ./scripts/coverage-bleat-api.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-coverage
          path: .build/coverage/bleat-api/lcov.info
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Publish coverage
    needs: [ios, host, rust]
    if: >-
      github.actor == 'yaleman' &&
      github.triggering_actor == 'yaleman' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'yaleman' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: "*-coverage"
          path: coverage
      - name: Publish Swift smoke coverage
        id: swift
        continue-on-error: true
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # 8d6379e14d29928660c4ba802d8e85393440b329
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: coverage/swift-coverage/cobertura.xml
          flag-name: swift-smoke
          parallel: true
      - name: Publish Swift host coverage
        id: host
        continue-on-error: true
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # 8d6379e14d29928660c4ba802d8e85393440b329
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: coverage/swift-host-coverage/lcov.info
          flag-name: swift-host
          parallel: true
      - name: Publish full Rust coverage
        id: rust
        continue-on-error: true
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # 8d6379e14d29928660c4ba802d8e85393440b329
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: coverage/rust-coverage/lcov.info
          flag-name: rust-full
          parallel: true
      - name: Finish combined coverage report
        id: finish
        continue-on-error: true
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # 8d6379e14d29928660c4ba802d8e85393440b329
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          parallel-finished: true
      - if: steps.swift.outcome == 'failure' || steps.host.outcome == 'failure' || steps.rust.outcome == 'failure' || steps.finish.outcome == 'failure'
        run: echo "::warning::Coveralls upload failed; test results remain available."
