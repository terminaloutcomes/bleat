name: Validate Bleat

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host tests and coverage
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Run host validation
        env:
          BLEAT_SKIP_SIMULATOR: "1"
        run: ./scripts/test-core.sh

  simulator:
    name: ${{ matrix.device }} Simulator tests
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        device:
          - iPhone 17 Pro
          - iPad (A16)
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Simulator validation
        env:
          BLEAT_SKIP_HOST: "1"
          BLEAT_SIMULATOR_DESTINATION: platform=iOS Simulator,name=${{ matrix.device }}
          BLEAT_TELEMETRY_AUTH_BASE_URL: ${{ secrets.BLEAT_TELEMETRY_AUTH_BASE_URL }}
          BLEAT_TELEMETRY_OTLP_ENDPOINT: ${{ secrets.BLEAT_TELEMETRY_OTLP_ENDPOINT }}
        run: |
          ./scripts/test-core.sh
      - name: Upload XCTest result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult-simulator-${{ matrix.device }}
          path: .build/test-core-results/*.xcresult
          if-no-files-found: warn
  accessibility:
    name: Accessibility tests
    runs-on: macos-26
    timeout-minutes: 180
    env:
      BLEAT_TELEMETRY_AUTH_BASE_URL: https://telemetry-auth.invalid
      BLEAT_TELEMETRY_OTLP_ENDPOINT: https://telemetry-otlp.invalid

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run accessibility validation
        run: ./scripts/test-accessibility-ui.sh

      - name: Upload accessibility results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-results
          path: .build/accessibility-ui-results/**
          if-no-files-found: warn

  archive:
    name: Unsigned Release archive
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BLEAT_CARPLAY_MODE: disabled
      BLEAT_TELEMETRY_AUTH_BASE_URL: https://telemetry-auth.invalid
      BLEAT_TELEMETRY_OTLP_ENDPOINT: https://telemetry-otlp.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate unsigned Release archive
        run: ./scripts/archive-beta.sh
